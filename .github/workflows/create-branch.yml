name: Auto Create Branch from Issue

on:
  issues:
    types: [opened]

jobs:
  create_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Issue Branch
        run: |
          # 1. 이슈 제목을 소문자로 바꾸고 공백을 하이픈(-)으로 변경
          TITLE=$(echo "${{ github.event.issue.title }}" | sed 's/[^a-zA-Z0-9-]/ /g' | awk '{print tolower($0)}' | tr ' ' '-')
          NUMBER="${{ github.event.issue.number }}"
          
          # 🌟 [이슈이름-issue-번호] 형태로 브랜치 이름 조립!
          BRANCH_NAME="${TITLE}-issue-${NUMBER}"
          
          echo "생성할 브랜치 이름: $BRANCH_NAME"
          
          # 2. 깃허브 봇 계정으로 안전하게 브랜치 생성 후 push
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin
          git checkout dev || git checkout main # dev 브랜치 기준 (없으면 main)
          
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"